<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeatherScope</title>
    <link rel="icon" href="./assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Homenaje&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Homenaje&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="forecast-container">
      <div class="forecast-header">
        <a
          href="https://github.com/Fa1sall/WeatherScope"
          class="logo-container"
        >
          <img class="logo" src="./assets/favicon.png" alt="logo" />
          <p class="logo-title">WeatherScope</p>
        </a>
        <div class="search-container">
          <input
            placeholder="Enter a city name"
            class="search-input"
            type="text"
          />
          <button class="search-btn">
            <img class="search-img" src="./assets/search.png" />
          </button>
        </div>
      </div>
      <div class="spinner-content">
        <div class="spinner"></div>
        <div class="spinner-desc"></div>
      </div>
      <div class="forecast-content"></div>
      <div class="forecast-footer"></div>
    </div>
  </body>
</html>
